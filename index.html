<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="今天只留一口：用三次直觉选择，为午饭留下一份真正想吃的答案。"
    />
    <title>今天只留一口</title>
    <style>
      :root {
        --tomato: #e4572e;
        --orange-peel: #f3a712;
        --cream: #fff7e8;
        --cream-deep: #f6ebd7;
        --matcha: #6a994e;
        --berry: #b56576;
        --chocolate: #4a2f27;
        --text: #2f241f;
        --text-muted: #7a685f;
        --line: rgba(74, 47, 39, 0.16);
        --line-soft: rgba(74, 47, 39, 0.09);
        --surface: rgba(255, 253, 247, 0.94);
        --shadow: 0 18px 36px rgba(74, 47, 39, 0.13);
        --shadow-soft: 0 8px 20px rgba(74, 47, 39, 0.09);
        --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          Arial, sans-serif;
        --serif: "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--cream);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background-color: var(--cream);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        content: "";
        pointer-events: none;
        opacity: 0.32;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E");
        background-size: 180px 180px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      button:not(:disabled) {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(228, 87, 46, 0.52);
        outline-offset: 4px;
      }

      .app {
        display: flex;
        flex-direction: column;
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 40px 34px;
      }

      .site-header {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
        align-items: center;
        min-height: 58px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        justify-self: start;
        gap: 10px;
        padding: 0;
        color: var(--chocolate);
        background: transparent;
      }

      .wordmark-text {
        font-family: var(--serif);
        font-size: clamp(1.25rem, 2vw, 1.62rem);
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .wordmark-mark {
        display: grid;
        gap: 4px;
        width: 22px;
      }

      .wordmark-mark::before,
      .wordmark-mark::after {
        display: block;
        height: 3px;
        content: "";
        background: var(--tomato);
        border-radius: 99px;
        transform: rotate(-20deg);
      }

      .wordmark-mark::after {
        width: 14px;
        justify-self: end;
      }

      .progress-shell {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        color: var(--chocolate);
      }

      .progress-text {
        min-width: 88px;
        font-family: var(--serif);
        font-size: 0.94rem;
        font-weight: 700;
        text-align: right;
        white-space: nowrap;
      }

      .progress-rail {
        display: flex;
        align-items: center;
        width: 152px;
      }

      .progress-dot {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(74, 47, 39, 0.25);
        border-radius: 50%;
        background: var(--cream);
        transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease;
      }

      .progress-dot:not(:last-child)::after {
        position: absolute;
        top: 5px;
        left: 12px;
        z-index: -1;
        width: 54px;
        height: 2px;
        content: "";
        background: rgba(74, 47, 39, 0.2);
        transition: background-color 180ms ease;
      }

      .progress-dot.is-active,
      .progress-dot.is-complete {
        border-color: var(--tomato);
        background: var(--tomato);
      }

      .progress-dot.is-active {
        transform: scale(1.15);
        box-shadow: 0 0 0 4px rgba(228, 87, 46, 0.12);
      }

      .progress-dot.is-complete::before {
        position: absolute;
        top: 1px;
        left: 4px;
        width: 4px;
        height: 7px;
        content: "";
        border: solid var(--cream);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .progress-dot.is-complete:not(:last-child)::after {
        background: var(--tomato);
      }

      .progress-dot.is-last-visible::after {
        display: none;
      }

      .header-actions {
        display: flex;
        justify-content: flex-end;
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        color: var(--chocolate);
        border: 1px solid transparent;
        border-radius: 50%;
        background: transparent;
        transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .icon-button:hover {
        border-color: var(--line);
        background: rgba(255, 253, 247, 0.7);
        transform: translateY(-1px);
      }

      .icon-button svg {
        width: 21px;
        height: 21px;
        stroke: currentColor;
      }

      .game-shell {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: clamp(30px, 5vw, 68px) 0 10px;
      }

      .match-view,
      .result-view {
        width: 100%;
        animation: arrive 420ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .prompt {
        max-width: 720px;
        margin: 0 auto clamp(24px, 3.5vw, 44px);
        text-align: center;
      }

      .prompt h1,
      .result-copy h1 {
        margin: 0;
        color: var(--chocolate);
        font-family: var(--serif);
        font-size: clamp(3rem, 5.4vw, 5.65rem);
        font-weight: 700;
        letter-spacing: 0.035em;
        line-height: 1.02;
      }

      .prompt h1 .accent-stroke {
        position: relative;
        display: inline-block;
      }

      .prompt h1 .accent-stroke::after {
        position: absolute;
        right: -4px;
        bottom: -9px;
        left: -4px;
        height: 5px;
        content: "";
        border-radius: 99px;
        background: var(--tomato);
        transform: rotate(-2deg);
      }

      .prompt p {
        margin: 22px 0 0;
        color: var(--text-muted);
        font-family: var(--serif);
        font-size: clamp(1rem, 1.7vw, 1.26rem);
        line-height: 1.65;
      }

      .match-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(250px, 0.72fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(18px, 3vw, 48px);
        width: min(1230px, 100%);
        margin: 0 auto;
      }

      .food-card {
        position: relative;
        display: block;
        min-width: 0;
        overflow: hidden;
        padding: 13px;
        color: var(--text);
        text-align: left;
        border: 1px solid rgba(74, 47, 39, 0.21);
        border-radius: 26px;
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        transition:
          transform 220ms cubic-bezier(0.2, 0.75, 0.25, 1),
          box-shadow 220ms ease,
          border-color 220ms ease,
          opacity 260ms ease;
      }

      .food-card::before {
        position: absolute;
        inset: 8px;
        z-index: 1;
        content: "";
        pointer-events: none;
        border: 1px solid rgba(74, 47, 39, 0.07);
        border-radius: 20px;
      }

      .food-card:hover,
      .food-card:focus-visible {
        z-index: 2;
        border-color: rgba(228, 87, 46, 0.58);
        box-shadow: 0 22px 38px rgba(74, 47, 39, 0.17);
        transform: translateY(-8px) rotate(-0.5deg);
      }

      .food-card:active {
        transform: translateY(-2px) scale(0.985);
      }

      .food-card.is-dragging {
        opacity: 0.32;
        transform: scale(0.96);
      }

      .food-card.is-chosen {
        z-index: 5;
        border-color: var(--tomato);
        box-shadow: 0 28px 48px rgba(228, 87, 46, 0.24);
        animation: chosen 460ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .food-card.is-lost {
        opacity: 0.25;
        transform: scale(0.94);
      }

      .food-image {
        position: relative;
        z-index: 0;
        display: grid;
        min-height: 216px;
        margin: 0;
        overflow: hidden;
        place-items: center;
        border-radius: 19px;
        background: var(--cream);
      }

      .food-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 300ms cubic-bezier(0.2, 0.75, 0.25, 1);
      }

      .food-card:hover .food-image img {
        transform: scale(1.045);
      }

      .food-copy {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: end;
        padding: 18px 10px 9px;
      }

      .food-name {
        display: block;
        color: var(--chocolate);
        font-family: var(--serif);
        font-size: clamp(1.3rem, 2.15vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.035em;
        line-height: 1.2;
      }

      .food-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.35;
      }

      .food-meta span + span::before {
        margin-right: 7px;
        color: rgba(74, 47, 39, 0.42);
        content: "·";
      }

      .food-meta .money {
        color: var(--tomato);
        font-weight: 700;
      }

      .food-meta .good {
        color: var(--matcha);
        font-weight: 700;
      }

      .card-grip {
        display: grid;
        grid-template-columns: repeat(2, 5px);
        gap: 4px;
        align-self: center;
        padding: 6px 0 6px 4px;
      }

      .card-grip i {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(74, 47, 39, 0.38);
      }

      .lunchbox-zone {
        position: relative;
        display: grid;
        min-height: 350px;
        place-items: center;
      }

      .lunchbox-zone.is-over .lunchbox-asset {
        filter: drop-shadow(0 18px 22px rgba(228, 87, 46, 0.24));
        transform: translateY(-6px) scale(1.02);
      }

      .lunchbox-asset {
        display: block;
        width: min(100%, 360px);
        height: auto;
        pointer-events: none;
        filter: drop-shadow(0 16px 18px rgba(74, 47, 39, 0.16));
        transition: filter 220ms ease, transform 220ms ease;
      }

      .drop-target {
        position: absolute;
        top: 55%;
        left: 50%;
        display: grid;
        width: 57%;
        min-height: 26%;
        padding: 12px;
        color: var(--tomato);
        place-items: center;
        pointer-events: none;
        text-align: center;
        transform: translate(-50%, -50%);
      }

      .drop-target svg {
        width: 31px;
        height: 31px;
        margin-bottom: 4px;
        stroke: currentColor;
      }

      .drop-target span {
        display: block;
        font-family: var(--serif);
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .replace-button {
        display: inline-flex;
        grid-column: 2;
        align-items: center;
        justify-self: center;
        gap: 8px;
        margin: -6px 0 0;
        padding: 8px 10px;
        color: var(--chocolate);
        font-family: var(--serif);
        font-size: 1rem;
        background: transparent;
        transition: color 160ms ease, transform 160ms ease;
      }

      .replace-button:hover {
        color: var(--tomato);
        transform: translateY(-2px);
      }

      .replace-button svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
      }

      .constraints-bar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: min(760px, 100%);
        margin: clamp(24px, 4vw, 44px) auto 0;
        overflow: hidden;
        border: 1px solid rgba(74, 47, 39, 0.2);
        border-radius: 18px;
        background: rgba(255, 253, 247, 0.58);
        box-shadow: 0 5px 14px rgba(74, 47, 39, 0.04);
      }

      .constraint {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 66px;
        gap: 10px;
        padding: 12px 14px;
        color: var(--chocolate);
        border-right: 1px solid var(--line);
        background: transparent;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .constraint:last-child {
        border-right: 0;
      }

      .constraint:hover {
        color: var(--tomato);
        background: rgba(255, 253, 247, 0.9);
      }

      .constraint svg {
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
        stroke: currentColor;
      }

      .constraint span {
        font-size: 0.99rem;
        font-weight: 650;
        white-space: nowrap;
      }

      .constraint small {
        display: block;
        margin-bottom: 2px;
        color: var(--text-muted);
        font-size: 0.71rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .result-view {
        width: min(1160px, 100%);
        margin: 0 auto;
      }

      .result-frame {
        position: relative;
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        min-height: 590px;
        overflow: hidden;
        align-items: center;
        padding: 52px clamp(34px, 6vw, 80px);
      }

      .result-lunchbox {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: -1;
        width: min(1080px, 110%);
        pointer-events: none;
        transform: translate(-50%, -48%);
      }

      .result-copy {
        max-width: 450px;
        padding-top: 6px;
      }

      .result-copy h1 {
        font-size: clamp(2.5rem, 4.3vw, 4.65rem);
        line-height: 1.1;
      }

      .result-food-name {
        margin: 21px 0 10px;
        color: var(--tomato);
        font-family: var(--serif);
        font-size: clamp(2rem, 3.5vw, 3.6rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }

      .result-reason {
        max-width: 355px;
        margin: 0;
        color: var(--text-muted);
        font-family: var(--serif);
        font-size: 1.12rem;
        line-height: 1.7;
      }

      .result-facts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 430px;
        margin: 25px 0 26px;
      }

      .fact {
        display: grid;
        gap: 6px;
        padding: 0 12px;
        place-items: center;
        text-align: center;
      }

      .fact:first-child {
        padding-left: 0;
      }

      .fact + .fact {
        border-left: 1px dashed rgba(74, 47, 39, 0.31);
      }

      .fact svg {
        width: 24px;
        height: 24px;
        color: var(--orange-peel);
        stroke: currentColor;
      }

      .fact strong {
        color: var(--chocolate);
        font-family: var(--serif);
        font-size: 1.05rem;
        white-space: nowrap;
      }

      .primary-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 224px;
        min-height: 60px;
        padding: 15px 26px;
        color: #fffaf2;
        border-radius: 14px;
        background: var(--tomato);
        box-shadow: 0 10px 0 #ba3f21, 0 18px 24px rgba(228, 87, 46, 0.21);
        font-family: var(--serif);
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        transition: transform 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
      }

      .primary-action:hover {
        background: #d44d27;
        box-shadow: 0 7px 0 #ba3f21, 0 14px 20px rgba(228, 87, 46, 0.2);
        transform: translateY(3px);
      }

      .primary-action:active {
        box-shadow: 0 2px 0 #ba3f21;
        transform: translateY(8px);
      }

      .secondary-action {
        display: block;
        margin: 22px 0 0 18px;
        padding: 0 2px 4px;
        color: var(--chocolate);
        border-bottom: 1px solid currentColor;
        background: transparent;
        font-family: var(--serif);
        font-size: 1.03rem;
        font-weight: 700;
        transition: color 160ms ease, transform 160ms ease;
      }

      .secondary-action:hover {
        color: var(--tomato);
        transform: translateX(3px);
      }

      .result-food-art {
        display: grid;
        height: 100%;
        min-height: 430px;
        margin: 0;
        place-items: center;
      }

      .result-food-art img {
        display: block;
        width: min(100%, 510px);
        max-height: 500px;
        object-fit: contain;
        filter: drop-shadow(0 22px 22px rgba(74, 47, 39, 0.21));
        animation: food-arrive 560ms 100ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .judgement {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(680px, 100%);
        min-height: 86px;
        margin: -4px auto 0;
        padding: 16px 24px;
        color: var(--matcha);
        border: 1px solid rgba(106, 153, 78, 0.44);
        border-radius: 10px;
        background: rgba(255, 253, 247, 0.65);
        box-shadow: 0 7px 16px rgba(74, 47, 39, 0.06);
        font-family: var(--serif);
        font-size: clamp(1.1rem, 2vw, 1.35rem);
        font-weight: 700;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .judgement::before,
      .judgement::after {
        width: 48px;
        height: 1px;
        margin: 0 20px;
        content: "";
        background: currentColor;
        opacity: 0.45;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        z-index: 10;
        padding: 12px 18px;
        color: var(--cream);
        border: 1px solid rgba(255, 247, 232, 0.16);
        border-radius: 999px;
        background: var(--chocolate);
        box-shadow: var(--shadow);
        font-size: 0.93rem;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 20px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      dialog {
        width: min(560px, calc(100vw - 32px));
        margin: auto;
        padding: 0;
        color: var(--text);
        border: 1px solid rgba(74, 47, 39, 0.2);
        border-radius: 24px;
        background: var(--cream);
        box-shadow: 0 34px 80px rgba(74, 47, 39, 0.3);
      }

      dialog::backdrop {
        background: rgba(74, 47, 39, 0.22);
        backdrop-filter: blur(3px);
      }

      .preferences-form {
        padding: 29px;
      }

      .preferences-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }

      .preferences-head h2 {
        margin: 0;
        font-family: var(--serif);
        font-size: 2rem;
        letter-spacing: 0.03em;
      }

      .preferences-head p {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .close-dialog {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        color: var(--chocolate);
        border-radius: 50%;
        background: rgba(74, 47, 39, 0.06);
        font-size: 1.55rem;
        line-height: 1;
      }

      .preference-group {
        margin: 25px 0 0;
        padding: 0;
        border: 0;
      }

      .preference-group legend {
        margin-bottom: 10px;
        color: var(--chocolate);
        font-family: var(--serif);
        font-size: 1.16rem;
        font-weight: 700;
      }

      .choice-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .choice-row label {
        position: relative;
        display: grid;
        min-height: 49px;
        padding: 8px;
        overflow: hidden;
        color: var(--text-muted);
        border: 1px solid var(--line);
        border-radius: 12px;
        place-items: center;
        background: rgba(255, 253, 247, 0.62);
        font-size: 0.91rem;
        font-weight: 650;
        text-align: center;
        transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
      }

      .choice-row input {
        position: absolute;
        opacity: 0;
      }

      .choice-row label:has(input:checked) {
        color: var(--tomato);
        border-color: rgba(228, 87, 46, 0.65);
        background: rgba(228, 87, 46, 0.08);
      }

      .dialog-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 30px;
      }

      .dialog-actions button {
        min-height: 48px;
        padding: 0 18px;
        border-radius: 12px;
        font-weight: 700;
      }

      .reset-preferences {
        color: var(--text-muted);
        background: transparent;
      }

      .save-preferences {
        min-width: 152px;
        color: var(--cream);
        background: var(--tomato);
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes chosen {
        0% {
          transform: translateY(0) scale(1);
        }
        48% {
          transform: translateY(-10px) scale(1.035);
        }
        100% {
          transform: translateY(6px) scale(0.975);
        }
      }

      @keyframes food-arrive {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.94);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 940px) {
        .app {
          padding-right: 24px;
          padding-left: 24px;
        }

        .site-header {
          grid-template-columns: 1fr auto;
        }

        .progress-shell {
          justify-self: end;
        }

        .header-actions {
          display: none;
        }

        .match-grid {
          grid-template-columns: 1fr minmax(170px, 0.55fr) 1fr;
          gap: 18px;
        }

        .food-image {
          min-height: 178px;
        }

        .lunchbox-zone {
          min-height: 270px;
        }

        .result-frame {
          min-height: 520px;
          padding-right: 38px;
          padding-left: 38px;
        }
      }

      @media (max-width: 720px) {
        .app {
          padding: 15px 16px 28px;
        }

        .site-header {
          min-height: 52px;
        }

        .progress-shell {
          gap: 9px;
        }

        .progress-text {
          min-width: 69px;
          font-size: 0.82rem;
        }

        .progress-rail {
          width: 90px;
        }

        .progress-dot {
          width: 14px;
          height: 14px;
        }

        .progress-dot:not(:last-child)::after {
          top: 4px;
          left: 10px;
          width: 29px;
        }

        .game-shell {
          display: block;
          padding-top: 35px;
        }

        .prompt {
          margin-bottom: 28px;
        }

        .prompt h1 {
          font-size: clamp(2.7rem, 12vw, 4.25rem);
        }

        .prompt p {
          max-width: 330px;
          margin: 18px auto 0;
          font-size: 1rem;
        }

        .match-grid {
          grid-template-columns: 1fr;
          gap: 13px;
          max-width: 490px;
        }

        .food-card {
          display: grid;
          grid-template-columns: minmax(128px, 40%) 1fr;
          gap: 2px;
          align-items: stretch;
          min-height: 164px;
          padding: 10px;
          border-radius: 21px;
        }

        .food-card::before {
          border-radius: 15px;
        }

        .food-image {
          min-height: 142px;
          border-radius: 14px;
        }

        .food-copy {
          align-content: center;
          padding: 10px 8px 9px 14px;
        }

        .food-name {
          font-size: 1.4rem;
        }

        .food-meta {
          display: block;
          font-size: 0.85rem;
          line-height: 1.65;
        }

        .food-meta span {
          display: block;
        }

        .food-meta span + span::before {
          display: none;
        }

        .card-grip {
          display: none;
        }

        .lunchbox-zone {
          grid-row: 3;
          min-height: 213px;
          margin-top: 4px;
        }

        .lunchbox-asset {
          width: 255px;
        }

        .drop-target {
          top: 57%;
          width: 52%;
          min-height: 25%;
        }

        .drop-target svg {
          width: 23px;
          height: 23px;
        }

        .drop-target span {
          font-size: 0.92rem;
        }

        .replace-button {
          grid-column: 1;
          grid-row: 4;
          margin-top: -16px;
        }

        .constraints-bar {
          grid-template-columns: 1fr;
          max-width: 490px;
          margin-top: 25px;
          border-radius: 15px;
        }

        .constraint {
          min-height: 52px;
          justify-content: flex-start;
          padding: 9px 19px;
          border-right: 0;
          border-bottom: 1px solid var(--line-soft);
        }

        .constraint:last-child {
          border-bottom: 0;
        }

        .constraint small {
          display: inline;
          margin: 0 7px 0 0;
        }

        .result-frame {
          display: flex;
          flex-direction: column;
          min-height: 0;
          padding: 58px 28px 22px;
          text-align: center;
        }

        .result-lunchbox {
          top: 44%;
          width: 680px;
          max-width: 178%;
          transform: translate(-50%, -50%);
        }

        .result-copy {
          position: relative;
          z-index: 1;
          max-width: 100%;
        }

        .result-copy h1 {
          font-size: clamp(2.3rem, 11vw, 3.7rem);
        }

        .result-food-name {
          margin-top: 17px;
          font-size: clamp(2rem, 10vw, 3.05rem);
        }

        .result-reason {
          margin-right: auto;
          margin-left: auto;
          font-size: 1rem;
        }

        .result-facts {
          margin-right: auto;
          margin-left: auto;
        }

        .primary-action {
          min-width: 210px;
        }

        .secondary-action {
          margin-right: auto;
          margin-left: auto;
        }

        .result-food-art {
          position: relative;
          z-index: 1;
          min-height: 255px;
          margin-top: 8px;
        }

        .result-food-art img {
          width: min(100%, 360px);
          max-height: 285px;
        }

        .judgement {
          min-height: 68px;
          margin-top: -2px;
          padding: 12px 14px;
          font-size: 1rem;
        }

        .judgement::before,
        .judgement::after {
          width: 24px;
          margin: 0 9px;
        }
      }

      @media (max-width: 390px) {
        .wordmark-text {
          font-size: 1.15rem;
        }

        .wordmark-mark {
          width: 18px;
        }

        .progress-text {
          min-width: 51px;
          font-size: 0.74rem;
        }

        .progress-rail {
          width: 74px;
        }

        .progress-dot:not(:last-child)::after {
          width: 21px;
        }

        .food-card {
          grid-template-columns: 122px 1fr;
        }

        .food-name {
          font-size: 1.23rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="site-header">
        <button class="wordmark" id="homeButton" type="button" aria-label="重新开始今天只留一口">
          <span class="wordmark-text">今天只留一口</span>
          <span class="wordmark-mark" aria-hidden="true"></span>
        </button>

        <div class="progress-shell" aria-label="淘汰进度">
          <span class="progress-text" id="progressText">第一口 · 1 / 3</span>
          <div class="progress-rail" aria-hidden="true">
            <span class="progress-dot is-active"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-button" id="openPreferences" type="button" aria-label="调整午饭条件">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16"></path>
              <path d="M7 12h10"></path>
              <path d="M10 18h4"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="game-shell" id="gameShell" aria-live="polite"></section>
    </main>

    <dialog id="preferencesDialog" aria-labelledby="preferencesTitle">
      <form class="preferences-form" id="preferencesForm">
        <div class="preferences-head">
          <div>
            <h2 id="preferencesTitle">今天的底线</h2>
            <p>只筛掉今天不会吃的，剩下的交给直觉。</p>
          </div>
          <button class="close-dialog" id="closePreferences" type="button" aria-label="关闭">×</button>
        </div>

        <fieldset class="preference-group">
          <legend>预算</legend>
          <div class="choice-row">
            <label><input type="radio" name="budget" value="25" />¥25 以内</label>
            <label><input type="radio" name="budget" value="35" checked />¥35 以内</label>
            <label><input type="radio" name="budget" value="45" />不太计较</label>
          </div>
        </fieldset>

        <fieldset class="preference-group">
          <legend>可用时间</legend>
          <div class="choice-row">
            <label><input type="radio" name="time" value="12" />12 分钟</label>
            <label><input type="radio" name="time" value="20" checked />20 分钟</label>
            <label><input type="radio" name="time" value="30" />30 分钟</label>
          </div>
        </fieldset>

        <fieldset class="preference-group">
          <legend>辣度</legend>
          <div class="choice-row">
            <label><input type="radio" name="spice" value="mild" checked />不要太辣</label>
            <label><input type="radio" name="spice" value="any" />都可以</label>
            <label><input type="radio" name="spice" value="comfort" />想吃热乎</label>
          </div>
        </fieldset>

        <div class="dialog-actions">
          <button class="reset-preferences" id="resetPreferences" type="button">恢复默认</button>
          <button class="save-preferences" type="submit">重新筛一轮</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const ASSET = "assets/";
      const STORAGE_KEY = "only-one-bite-preferences-v1";
      const DEFAULT_PREFERENCES = { budget: 35, time: 20, spice: "mild" };

      const foodPool = [
        {
          id: "yellow-braised-chicken-rice",
          name: "黄焖鸡米饭",
          price: 28,
          minutes: 8,
          spice: 1,
          spiceLabel: "不辣",
          image: ASSET + "food-yellow-braised-chicken-rice.png",
          reason: "够香、走得不远，今天这顿能吃得很踏实。"
        },
        {
          id: "lanzhou-beef-noodles",
          name: "兰州牛肉面",
          price: 22,
          minutes: 12,
          spice: 1,
          spiceLabel: "热乎",
          image: ASSET + "food-lanzhou-beef-noodles.png",
          reason: "热乎、够快，能把下午的会撑过去。"
        },
        {
          id: "braised-chicken-leg-rice",
          name: "沙县鸡腿饭",
          price: 24,
          minutes: 7,
          spice: 0,
          spiceLabel: "稳",
          image: ASSET + "food-braised-chicken-leg-rice.png",
          reason: "不折腾、很顶饿，今天把力气留给下午。"
        },
        {
          id: "tomato-egg-noodles",
          name: "番茄鸡蛋面",
          price: 20,
          minutes: 9,
          spice: 0,
          spiceLabel: "轻一点",
          image: ASSET + "food-tomato-egg-noodles.png",
          reason: "清爽又热乎，今天胃口想轻一点也能被照顾到。"
        },
        {
          id: "malatang",
          name: "麻辣烫",
          price: 30,
          minutes: 17,
          spice: 3,
          spiceLabel: "有点辣",
          image: ASSET + "food-malatang.png",
          reason: "这一口够痛快，今天想犒劳自己就别太克制。"
        }
      ];

      const icons = {
        refresh:
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.9 4"></path><path d="M20 20v-5h-5"></path></svg>',
        lunchbox:
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9.5h14l-1 10H6l-1-10Z"></path><path d="M8 9.5V7.7c0-1 1-1.7 2.2-1.7h3.6c1.2 0 2.2.7 2.2 1.7v1.8"></path><path d="M4 11.5h16"></path></svg>',
        money:
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 5V3h8v2"></path><path d="M12 9v7"></path><path d="M14.5 10.5c-.45-.6-1.2-1-2.35-1-1.3 0-2.15.65-2.15 1.55 0 2.25 4.5.9 4.5 3.2 0 .95-.9 1.75-2.4 1.75-1.05 0-1.95-.4-2.45-1"></path></svg>',
        clock:
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7.5V12l3.1 2"></path></svg>',
        chilli:
          '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8c1.1-2.8 3.2-3.5 5-3"></path><path d="M10.2 10.2C7.4 8.3 4.7 9 3.5 11.4c-1.3 2.7.3 6.7 3.7 8.1 3.5 1.5 7.8-.2 9.6-4.1 1.3-2.8.8-5.6-1-7.2-1.2 1.5-3.2 2.3-5.6 2Z"></path><path d="M10.4 9.8c.1-1.6-.5-3-1.8-3.8"></path></svg>'
      };

      const gameShell = document.getElementById("gameShell");
      const homeButton = document.getElementById("homeButton");
      const progressText = document.getElementById("progressText");
      const progressDots = Array.from(document.querySelectorAll(".progress-dot"));
      const preferencesDialog = document.getElementById("preferencesDialog");
      const preferencesForm = document.getElementById("preferencesForm");
      const toast = document.getElementById("toast");

      let preferences = loadPreferences();
      let state = createGame(false);
      let toastTimer = null;

      function loadPreferences() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!stored) return { ...DEFAULT_PREFERENCES };
          return {
            budget: Number(stored.budget) || DEFAULT_PREFERENCES.budget,
            time: Number(stored.time) || DEFAULT_PREFERENCES.time,
            spice: ["mild", "any", "comfort"].includes(stored.spice)
              ? stored.spice
              : DEFAULT_PREFERENCES.spice
          };
        } catch {
          return { ...DEFAULT_PREFERENCES };
        }
      }

      function savePreferences() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(preferences));
      }

      function shuffle(items) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function eligibleFoods() {
        return foodPool.filter(function (food) {
          const withinBudget = food.price <= preferences.budget;
          const withinTime = food.minutes <= preferences.time;
          const spiceOkay = preferences.spice === "any" || food.spice <= 1;
          const comfortOkay = preferences.spice !== "comfort" || food.minutes <= preferences.time;
          return withinBudget && withinTime && spiceOkay && comfortOkay;
        });
      }

      function createGame(shouldShuffle) {
        const available = eligibleFoods();
        const candidates = shouldShuffle ? shuffle(available).slice(0, 4) : available.slice(0, 4);
        return {
          phase: "game",
          candidates: candidates,
          round: 0,
          totalRounds: candidates.length === 3 ? 2 : 3,
          winners: [],
          history: [],
          winner: null,
          runnerUp: null,
          locked: false
        };
      }

      function currentPair() {
        if (state.candidates.length === 3) {
          return state.round === 0
            ? state.candidates.slice(0, 2)
            : [state.winners[0], state.candidates[2]];
        }
        if (state.round === 0) return state.candidates.slice(0, 2);
        if (state.round === 1) return state.candidates.slice(2, 4);
        return state.winners.slice(0, 2);
      }

      function roundLabel() {
        if (state.phase === "result") return state.totalRounds + "轮已完成";
        if (state.totalRounds === 2) {
          return ["第一口 · 1 / 2", "最后一口 · 2 / 2"][state.round];
        }
        return ["第一口 · 1 / 3", "第二口 · 2 / 3", "最后一口 · 3 / 3"][state.round];
      }

      function roundPrompt() {
        if (state.round === 0) {
          return {
            title: "先留下哪一口？",
            note: "今天能吃上的" + state.candidates.length + "顿饭，替你先筛好了。"
          };
        }

        if (state.round === 1 && state.totalRounds === 3) {
          return {
            title: "再留下一口。",
            note: "不必解释，今天只听胃和时间的。"
          };
        }

        return {
          title: "最后，只留一口。",
          note: "这两个都不错。现在让今天的午饭定下来。"
        };
      }

      function renderCard(food) {
        return (
          '<button class="food-card" type="button" data-food-id="' +
          food.id +
          '" draggable="true" aria-label="留下' +
          food.name +
          '，' +
          food.price +
          '元，' +
          food.minutes +
          '分钟，' +
          food.spiceLabel +
          '">' +
          '<figure class="food-image"><img src="' +
          food.image +
          '" alt="' +
          food.name +
          '插画" /></figure>' +
          '<span class="food-copy">' +
          '<span><strong class="food-name">' +
          food.name +
          "</strong>" +
          '<span class="food-meta"><span class="money">¥' +
          food.price +
          "</span><span>" +
          food.minutes +
          " 分钟到手</span><span class=\"good\">" +
          food.spiceLabel +
          "</span></span></span>" +
          '<span class="card-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>' +
          "</span></button>"
        );
      }

      function renderMatch() {
        const pair = currentPair();
        const prompt = roundPrompt();
        gameShell.innerHTML =
          '<section class="match-view" aria-labelledby="matchTitle">' +
          '<div class="prompt"><h1 id="matchTitle">' +
          formatPromptTitle(prompt.title) +
          '</h1><p>' +
          prompt.note +
          "</p></div>" +
          '<div class="match-grid">' +
          renderCard(pair[0]) +
          '<div class="lunchbox-zone" id="dropZone" aria-label="午饭盒，拖入想留下的午饭">' +
          '<img class="lunchbox-asset" src="assets/lunchbox.png" alt="" />' +
          '<span class="drop-target">' +
          icons.lunchbox +
          "<span>放进午饭盒</span></span></div>" +
          renderCard(pair[1]) +
          '<button class="replace-button" id="refreshChoices" type="button">' +
          icons.refresh +
          "<span>换一组，不解释</span></button>" +
          "</div>" +
          renderConstraints() +
          "</section>";
        bindMatchEvents();
      }

      function formatPromptTitle(title) {
        if (title === "先留下哪一口？") {
          return "先留下<span class=\"accent-stroke\">哪一口</span>？";
        }
        return title;
      }

      function renderConstraints() {
        const budgetText = preferences.budget === 45 ? "不太计较" : "¥" + preferences.budget + "以内";
        const timeText = preferences.time + " 分钟内";
        const spiceText =
          preferences.spice === "any" ? "都可以" : preferences.spice === "comfort" ? "想吃热乎" : "不要太辣";

        return (
          '<div class="constraints-bar" aria-label="当前午饭条件">' +
          '<button class="constraint" type="button" data-preference="budget">' +
          icons.money +
          "<span><small>预算</small>" +
          budgetText +
          "</span></button>" +
          '<button class="constraint" type="button" data-preference="time">' +
          icons.clock +
          "<span><small>时间</small>" +
          timeText +
          "</span></button>" +
          '<button class="constraint" type="button" data-preference="spice">' +
          icons.chilli +
          "<span><small>口味</small>" +
          spiceText +
          "</span></button></div>"
        );
      }

      function renderResult() {
        const food = state.winner;
        const runner = state.runnerUp;
        const runnerText =
          runner.name +
          " · " +
          (runner.minutes < food.minutes
            ? "能少等 " + (food.minutes - runner.minutes) + " 分钟"
            : "便宜 ¥" + Math.max(food.price - runner.price, 0));

        gameShell.innerHTML =
          '<section class="result-view" aria-labelledby="resultTitle">' +
          '<div class="result-frame">' +
          '<img class="result-lunchbox" src="assets/lunchbox.png" alt="" />' +
          '<div class="result-copy">' +
          '<h1 id="resultTitle">今天中午，<br />就吃它。</h1>' +
          '<h2 class="result-food-name">' +
          food.name +
          "</h2>" +
          '<p class="result-reason">' +
          food.reason +
          "</p>" +
          '<div class="result-facts" aria-label="午饭信息">' +
          '<div class="fact">' +
          icons.money +
          "<strong>¥" +
          food.price +
          "</strong></div>" +
          '<div class="fact">' +
          icons.clock +
          "<strong>" +
          food.minutes +
          " 分钟到手</strong></div>" +
          '<div class="fact">' +
          icons.chilli +
          "<strong>" +
          food.spiceLabel +
          "</strong></div></div>" +
          '<button class="primary-action" id="searchFood" type="button">去搜这家</button>' +
          '<button class="secondary-action" id="rematch" type="button">和亚军再比一次</button>' +
          "</div>" +
          '<figure class="result-food-art"><img src="' +
          food.image +
          '" alt="' +
          food.name +
          '插画" /></figure></div>' +
          '<p class="judgement">亚军：' +
          runnerText +
          "　·　今天的午饭判决：稳住了</p>" +
          "</section>";
        document.getElementById("searchFood").addEventListener("click", function () {
          const query = encodeURIComponent(food.name + " 附近");
          window.open("https://www.baidu.com/s?wd=" + query, "_blank", "noopener,noreferrer");
          showToast("已为你打开搜索。去吃饭吧。");
        });
        document.getElementById("rematch").addEventListener("click", rematchFinal);
      }

      function render() {
        progressText.textContent = roundLabel();
        progressDots.forEach(function (dot, index) {
          dot.classList.remove("is-active", "is-complete");
          dot.hidden = state.totalRounds === 2 && index === 2;
          dot.classList.toggle("is-last-visible", state.totalRounds === 2 && index === 1);
          if (state.phase === "result" || index < state.round) dot.classList.add("is-complete");
          else if (index === state.round) dot.classList.add("is-active");
        });

        if (state.phase === "result") renderResult();
        else renderMatch();
      }

      function bindMatchEvents() {
        const dropZone = document.getElementById("dropZone");
        const cards = Array.from(document.querySelectorAll(".food-card"));

        cards.forEach(function (card) {
          card.addEventListener("click", function () {
            chooseFood(card.dataset.foodId);
          });
          card.addEventListener("dragstart", function (event) {
            event.dataTransfer.setData("text/plain", card.dataset.foodId);
            event.dataTransfer.effectAllowed = "move";
            card.classList.add("is-dragging");
          });
          card.addEventListener("dragend", function () {
            card.classList.remove("is-dragging");
            dropZone.classList.remove("is-over");
          });
        });

        dropZone.addEventListener("dragover", function (event) {
          event.preventDefault();
          if (!state.locked) dropZone.classList.add("is-over");
        });
        dropZone.addEventListener("dragleave", function () {
          dropZone.classList.remove("is-over");
        });
        dropZone.addEventListener("drop", function (event) {
          event.preventDefault();
          dropZone.classList.remove("is-over");
          chooseFood(event.dataTransfer.getData("text/plain"));
        });

        document.getElementById("refreshChoices").addEventListener("click", function () {
          state = createGame(true);
          showToast("换了一组。今天还是你说了算。");
          render();
        });

        document.querySelectorAll("[data-preference]").forEach(function (button) {
          button.addEventListener("click", function () {
            openPreferences(button.dataset.preference);
          });
        });
      }

      function chooseFood(id) {
        if (state.locked) return;
        const pair = currentPair();
        const picked = pair.find(function (food) {
          return food.id === id;
        });
        if (!picked) return;

        const other = pair.find(function (food) {
          return food.id !== id;
        });
        const selectedCard = document.querySelector('[data-food-id="' + id + '"]');
        const otherCard = document.querySelector('[data-food-id="' + other.id + '"]');
        state.locked = true;
        selectedCard.classList.add("is-chosen");
        otherCard.classList.add("is-lost");

        window.setTimeout(function () {
          state.history.push({ winner: picked, loser: other });
          if (state.round < state.totalRounds - 1) {
            state.winners.push(picked);
            state.round += 1;
          } else {
            state.winner = picked;
            state.runnerUp = other;
            state.phase = "result";
          }
          state.locked = false;
          render();
        }, 430);
      }

      function rematchFinal() {
        state.phase = "game";
        state.round = state.totalRounds - 1;
        state.winners = [state.winner, state.runnerUp];
        state.winner = null;
        state.runnerUp = null;
        state.locked = false;
        showToast("再给你一次机会。只听这一口。");
        render();
      }

      function openPreferences(focusGroup) {
        syncPreferenceForm();
        preferencesDialog.showModal();
        const target =
          preferencesForm.querySelector('input[name="' + (focusGroup || "budget") + '"]:checked') ||
          preferencesForm.querySelector("input");
        window.setTimeout(function () {
          target.focus();
        }, 0);
      }

      function syncPreferenceForm() {
        ["budget", "time", "spice"].forEach(function (name) {
          const value = String(preferences[name]);
          const input = preferencesForm.querySelector('input[name="' + name + '"][value="' + value + '"]');
          if (input) input.checked = true;
        });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("is-visible");
        }, 2600);
      }

      document.getElementById("openPreferences").addEventListener("click", function () {
        openPreferences();
      });

      document.getElementById("closePreferences").addEventListener("click", function () {
        preferencesDialog.close();
      });

      document.getElementById("resetPreferences").addEventListener("click", function () {
        preferences = { ...DEFAULT_PREFERENCES };
        syncPreferenceForm();
      });

      preferencesForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const formData = new FormData(preferencesForm);
        preferences = {
          budget: Number(formData.get("budget")),
          time: Number(formData.get("time")),
          spice: formData.get("spice")
        };
        savePreferences();
        preferencesDialog.close();
        state = createGame(true);
        showToast("按你的底线，重新筛好了四顿饭。");
        render();
      });

      homeButton.addEventListener("click", function () {
        state = createGame(false);
        showToast("重新开始。今天只留一口。");
        render();
      });

      render();
    </script>
  </body>
</html>
